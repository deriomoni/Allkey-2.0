services:
  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: https://allkey.kz
      # Модуль «Операции» (раздел «Компании»): значения — в .env сервера, не в репозитории.
      # KGD_API_TOKEN на сервер не переносится — проверка КГД работает только локально.
      OPS_ADMIN_USER_ID: ${OPS_ADMIN_USER_ID}
      ARTY_OPS_PATH: /arty-ops
      OPS_UI_BUNDLE_PATH: /ops-ui/ops.js
      # решения из панели — коммит в ветку prod-decisions и push сразу после коммита
      OPS_REPO_BRANCH: prod-decisions
      OPS_REPO_PUSH: ${OPS_REPO_PUSH:-true}
    volumes:
      # клон allkey-ops на сервере (карточки; решения из UI коммитятся в него от системы)
      - /root/arty-ops:/arty-ops
      # deploy-ключ allkey-ops (запись) и known_hosts github.com; путь тот же, что в core.sshCommand клона
      - /root/arty-ops-ssh:/root/arty-ops-ssh:ro
      # отдельный бандл раздела (npm run build:ops) — отдаётся только через /api/ops/ui/bundle.js
      - ./frontend/dist-ops:/ops-ui:ro
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
