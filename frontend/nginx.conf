server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # index.html и SPA-маршруты НЕ кэшируем: иначе после деплоя браузер тянет старый
    # index.html, а он ссылается на старый хэш бандла — новые правки не видны, пока
    # не истечёт кэш. Хэшированные ассеты (регуляркой ниже) остаются immutable —
    # их имя меняется при каждой сборке, поэтому кэшировать их надолго безопасно.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
