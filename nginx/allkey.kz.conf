# HTTP — ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name allkey.kz api.allkey.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend: allkey.kz
server {
    listen 443 ssl http2;
    server_name allkey.kz;

    ssl_certificate /etc/letsencrypt/live/allkey.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allkey.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Backend API: api.allkey.kz
server {
    listen 443 ssl http2;
    server_name api.allkey.kz;

    ssl_certificate /etc/letsencrypt/live/allkey.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allkey.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50M;
    }
}
