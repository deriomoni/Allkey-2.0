# Тестовый поддомен hr.allkey.kz / api.hr.allkey.kz — ОТДЕЛЬНЫЙ файл.
# Прод-конфиг nginx/allkey.kz.conf НЕ трогаем.
# Ставится на сервер как /etc/nginx/sites-available/hr.allkey.kz.conf
# ВАЖНО: включать этот файл (с блоками 443) можно ТОЛЬКО после того, как
# получен сертификат (см. DEPLOY-TEST.md, шаг с certbot) — иначе `nginx -t`
# упадёт из-за отсутствующего файла сертификата.

# HTTP — ACME-проверка (получение/продление сертификата) + редирект на HTTPS
server {
    listen 80;
    server_name hr.allkey.kz api.hr.allkey.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Фронтенд теста: hr.allkey.kz -> контейнер на 127.0.0.1:3001
server {
    listen 443 ssl http2;
    server_name hr.allkey.kz;

    ssl_certificate /etc/letsencrypt/live/hr.allkey.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.allkey.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API теста: api.hr.allkey.kz -> контейнер на 127.0.0.1:8001
server {
    listen 443 ssl http2;
    server_name api.hr.allkey.kz;

    ssl_certificate /etc/letsencrypt/live/hr.allkey.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.allkey.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50M;   # загрузка .xlsx-описи и т.п.
    }
}
